<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 12 - Table Sections</title>
</head>
<body>
    <table border="1" cellpadding="8">
        <caption>Student Marks</caption>
        <thead>
            <tr>
                <th scope="col">Roll</th>
                <th scope="col">Name</th>
                <th scope="col">Marks</th>
            </tr>

        <tbody>
            <tr><td>1</td><td>Aman</td><td>85</td></tr>
            <tr><td>2</td><td>Riya</td><td>92</td></tr>
        </tbody>
        <tfoot>
            <tr><th colspan="2" scope="row">Average</th><td>88.5</td></tr>
        </tfoot>
    </table>
</body>
</html>
