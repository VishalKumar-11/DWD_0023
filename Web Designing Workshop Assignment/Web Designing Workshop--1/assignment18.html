<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 20px auto;
            padding: 0 15px;
            line-height: 1.5;
        }
        header {
            background: #202878;
            color: white;
            text-align: center;
            padding: 14px;
        }
        footer {
            background: #202878;
            color: white;
            text-align: center;
            padding: 0.5px;
            margin-top: 10px;
        }
        main { max-width: 620px; margin: 20px auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        caption { font-weight: bold; padding: 8px; }
        th, td { border: 1px solid #999; padding: 8px; text-align: left; }
        th { background: #e8e9f3; }
        fieldset { padding: 15px; }
        label { display: block; margin-top: 12px; }
        input, select, textarea { width: 100%; max-width: 100%; padding: 7px; }
        button { margin-top: 15px; padding: 8px 14px; }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section aria-labelledby="courses-heading">
            <h2 id="courses-heading">Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <thead>
                    <tr><th scope="col">Course</th><th scope="col">Seats</th><th scope="col">Fees</th></tr>
                </thead>
                <tbody>
                    <tr><td>B.Tech CSE</td><td>120</td><td>₹90,000</td></tr>
                    <tr><td>BCA</td><td>60</td><td>₹45,000</td></tr>
                </tbody>
            </table>
        </section>

        <section aria-labelledby="form-heading">
            <form action="#" method="get">
                <fieldset>
                    <legend id="form-heading">Application Form</legend>

                    <label for="student-name">Name:</label>
                    <input type="text" id="student-name" name="name" required>

                    <label for="student-email">Email:</label>
                    <input type="email" id="student-email" name="email" required>

                    <label for="student-course">Course:</label>
                    <select id="student-course" name="course" required>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>

                    <label for="statement">Statement:</label>
                    <textarea id="statement" name="statement" rows="4" required></textarea>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
